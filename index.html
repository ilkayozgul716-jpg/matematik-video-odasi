<title>Matematik Video Odası</title>
<style>

  @media (prefers-color-scheme:dark){:root{--zemin:#0f1420;--kart:#19202e;--yazi:#eef0f4;--soluk:#9aa3b2;--cizgi:#2a3344;--ana:#0b1020}}
  *{box-sizing:border-box} html,body{margin:0;background:var(--zemin);color:var(--yazi);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
  header{background:var(--ana);color:#fff;padding:20px 16px 16px;padding-top:max(20px,env(safe-area-inset-top))}
  header h1{margin:0;font-size:22px} header h1 span{color:var(--vurgu)}
  header p{margin:4px 0 0;color:#c9d1e0;font-size:14px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 12px 40px}
  h2{font-size:15px;color:var(--soluk);font-weight:600;margin:22px 4px 10px}
  .izgara{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:700px){.izgara{grid-template-columns:repeat(3,1fr)}}
  @media (min-width:950px){.izgara{grid-template-columns:repeat(4,1fr)}}
  .foto{position:relative;display:block;width:100%;aspect-ratio:3/4;border:0;padding:0;border-radius:14px;overflow:hidden;background:#fff center top/cover no-repeat;cursor:pointer;box-shadow:0 1px 3px #0002}
  .etiket{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border-radius:10px;font:600 15px/1.2 "Segoe UI",system-ui,sans-serif;color:#fff;background:var(--iyi)}
  .foto.bekliyor .etiket{background:#14213dcc;font-weight:500;font-size:13px}
  .foto.izlendi .etiket{background:#14213dcc}
  .foto.izlendi::before{content:"✓";position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--iyi);color:#fff;display:grid;place-items:center;font-weight:700}
  .coklu{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--vurgu);color:#14213d}
  h2.bolum{font-size:19px;color:var(--yazi);font-weight:800;margin:22px 4px 4px}
  h3{font-size:14px;color:var(--soluk);margin:14px 4px 8px}
  .seri{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
  .bolumkart{flex:0 0 46%;max-width:220px;aspect-ratio:3/4;scroll-snap-align:start;border:0;border-radius:14px;color:#fff;
    position:relative;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:14px;text-align:left;
    font:inherit;cursor:pointer;box-shadow:0 1px 3px #0002}
  .bolumkart .no{font-size:13px;font-weight:700;opacity:.85}
  .bolumkart .ad{font-size:19px;font-weight:800;line-height:1.2}
  .bolumkart .etiket{position:absolute;left:8px;right:8px;bottom:8px;padding:9px 8px;border-radius:10px;background:#0006;font-weight:600;text-align:center}
  .bolumkart.izlendi::before{content:"✓";position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--iyi);display:grid;place-items:center;font-weight:700}
  .bos{color:var(--soluk);text-align:center;padding:60px 0}
  dialog{border:0;padding:0;width:min(960px,100vw);max-width:100vw;max-height:100dvh;background:var(--kart);color:var(--yazi);border-radius:16px}
  dialog::backdrop{background:#000d}
  .oynatici{aspect-ratio:16/9;background:#000} .oynatici iframe{width:100%;height:100%;border:0}
  .detay{padding:12px 16px 16px}
  .ad{font-weight:700;font-size:17px}
  .cevap{color:var(--iyi);font-weight:600}
  .dugmeler{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .dugmeler button,.dugmeler a{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--cizgi);background:var(--zemin);color:var(--yazi);text-decoration:none;cursor:pointer}
  .dugmeler .ana{background:var(--iyi);border-color:var(--iyi);color:#fff}
</style>
</head>

const $ = s => document.querySelector(s);
let aktif = null;
function izlenenler(){ try { return new Set(JSON.parse(localStorage.getItem("izlenen") || "[]")); } catch(_) { return new Set(); } }
function izleKaydet(s){ try { localStorage.setItem("izlenen", JSON.stringify([...s])); } catch(_){} }
function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function gunAdi(ts){
  const g = new Date(ts*1000), b = new Date(); b.setHours(0,0,0,0);
  const fark = Math.round((b - new Date(g.getFullYear(), g.getMonth(), g.getDate())) / 864e5);
  if (fark === 0) return "Bugün gönderdiklerin";
  if (fark === 1) return "Dün gönderdiklerin";
  return g.toLocaleDateString("tr-TR", {day:"numeric", month:"long", weekday:"long"});
}
const KONU_RENK = {"Kareköklü ifadeler": ["#7B2FF7", "#FF3D7F"], "Üslü ifadeler": ["#0F6FB8", "#22D3C5"],
                   "EBOB ve EKOK": ["#FF8A3D", "#FFD23F"], "Alan ve çevre problemleri": ["#16A34A", "#A3E635"]};
function konuHtml(iz){
  const konular = VIDEOLAR.filter(v => v.tur === "konu");
  if (!konular.length) return "";
  const gruplar = {};
  konular.forEach(v => (gruplar[v.konu || "Konu"] = gruplar[v.konu || "Konu"] || []).push(v));
  let html = '<h2 class="bolum">📘 Konu anlatımları</h2>';
  for (const [ad, liste] of Object.entries(gruplar)) {
    liste.sort((a, b) => (a.kod || "").localeCompare(b.kod || ""));
    const [r1, r2] = KONU_RENK[ad] || ["#14213d", "#5B21B6"];
    html += `<h3>${esc(ad)}</h3><div class="seri">` + liste.map((v, i) => {
      const hazir = !!v.drive_id, izl = hazir && iz.has(v.id);
      const ad2 = (v.baslik || "").replace(/^K\d-\d · /, "");
      return `<button class="bolumkart ${hazir ? "" : "bekliyor"} ${izl ? "izlendi" : ""}" data-id="${v.id}"
        style="background:linear-gradient(135deg,${r1},${r2})">
        <span class="no">${i + 1}. bölüm</span><span class="ad">${esc(ad2)}</span>
        <span class="etiket">${hazir ? (izl ? "▶ Tekrar izle" : "▶ İzle") : "⏳ Hazırlanıyor"}</span></button>`;
    }).join("") + "</div>";
  }
  return html;
}
function ciz(){
  const iz = izlenenler();
  if (!VIDEOLAR.length) { $("#icerik").innerHTML = '<div class="bos">Henüz video yok.</div>'; return; }
  // her fotoğraf ayrı kutu; blokta aynı videoya gider
  const kutular = [];
  VIDEOLAR.filter(v => v.tur !== "konu").forEach(v => (v.resimler.length ? v.resimler : [""]).forEach((r, i) =>
    kutular.push({v, r, sira: i + 1, toplam: v.resimler.length})));
  kutular.sort((a, b) => b.v.olusturma - a.v.olusturma || a.sira - b.sira);
  let html = konuHtml(iz) + (kutular.length ? '<h2 class="bolum">📷 Gönderdiğin sorular</h2>' : ""), sonGun = "";
  kutular.forEach(k => {
    const gun = gunAdi(k.v.olusturma);
    if (gun !== sonGun) { html += (sonGun ? "</div>" : "") + `<h2>${esc(gun)}</h2><div class="izgara">`; sonGun = gun; }
    const hazir = !!k.v.drive_id, izlendi = hazir && iz.has(k.v.id);
    html += `<button class="foto ${hazir ? "" : "bekliyor"} ${izlendi ? "izlendi" : ""}" data-id="${k.v.id}"
      style="background-image:url('${k.r}')" aria-label="${esc(k.v.baslik)}">
      ${k.toplam > 1 ? `<span class="coklu">${k.sira}/${k.toplam}</span>` : ""}
      <span class="etiket">${hazir ? (izlendi ? "▶ Tekrar izle" : "▶ İzle") : "⏳ Video hazırlanıyor"}</span></button>`;
  });
  $("#icerik").innerHTML = html + (sonGun ? "</div>" : "");
  document.querySelectorAll(".foto, .bolumkart").forEach(b => b.onclick = () => ac(b.dataset.id));
  const hazir = VIDEOLAR.filter(v => v.drive_id).length;
  $("#ozet").textContent = hazir ? `${hazir} video hazır. Bir karta dokun, izle.` : "Videolar hazırlanıyor. Hazır olanlar burada oynar.";
}
function ac(id){
  aktif = VIDEOLAR.find(v => v.id === id); if (!aktif) return;
  $("#oynatici").innerHTML = aktif.drive_id
    ? `<iframe src="https://drive.google.com/file/d/${aktif.drive_id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`
    : `<div style="height:100%;display:grid;place-items:center;color:#fff;text-align:center;padding:20px">Bu sorunun videosu hazırlanıyor.<br>Biraz sonra tekrar bak!</div>`;
  $("#dAd").textContent = aktif.baslik || "";
  $("#dCevap").innerHTML = aktif.cevap ? `Cevap: <span class="cevap">${esc(aktif.cevap)}</span>` : "";
  $("#dDrive").href = aktif.drive || "#"; $("#dDrive").style.display = aktif.drive ? "" : "none";
  $("#dIzle").style.display = aktif.drive_id ? "" : "none";
  $("#dIzle").textContent = izlenenler().has(id) ? "İzlenmedi yap" : "✓ İzledim";
  $("#pencere").showModal();
}
function kapat(){ $("#oynatici").innerHTML = ""; $("#pencere").close(); }
$("#dKapat").onclick = kapat;
$("#pencere").addEventListener("cancel", e => { e.preventDefault(); kapat(); });
$("#pencere").addEventListener("click", e => { if (e.target === $("#pencere")) kapat(); });
$("#dIzle").onclick = () => { const s = izlenenler(); s.has(aktif.id) ? s.delete(aktif.id) : s.add(aktif.id); izleKaydet(s); kapat(); ciz(); };
ciz();
</script>
